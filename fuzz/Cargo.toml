[package]
name = "eggreplay-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.eggreplay-core]
path = "../crates/eggreplay-core"

[dependencies.eggreplay-har]
path = "../crates/eggreplay-har"

[dependencies.eggreplay-store]
path = "../crates/eggreplay-store"

[[bin]]
name = "har_import"
path = "fuzz_targets/har_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_open"
path = "fuzz_targets/session_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_transcript"
path = "fuzz_targets/websocket_transcript.rs"
test = false
doc = false
bench = false

# This is a standalone nightly-only workspace. It is deliberately not a member
# of the product workspace, whose locked gate must never require nightly.
[workspace]
