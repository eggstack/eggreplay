[workspace]
resolver = "3"
members = [
    "crates/eggreplay-core",
    "crates/eggreplay-store",
    "crates/eggreplay-http",
    "crates/eggreplay-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggreplay"
homepage = "https://github.com/eggstack/eggreplay"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Published and temporary sibling seams. EggServe and Eggress do not yet
# publish the required embeddable crates; keep exact revisions until the
# removal gate in docs/architecture.md is satisfied.
eggfetch-core = { version = "0.2.0", default-features = false, features = ["native-http1", "tls-rustls", "tls-native-roots"] }
eggserve-primitives = { git = "https://github.com/eggstack/eggserve.git", rev = "859a2bc2fe1d9e6215c122d19cd50f2f070d2da6" }
eggserve-server = { git = "https://github.com/eggstack/eggserve.git", rev = "859a2bc2fe1d9e6215c122d19cd50f2f070d2da6" }
eggress-outbound = { git = "https://github.com/eggstack/eggress.git", rev = "c493eab803654d1316150a9837fd01ee46b9b87d", default-features = false }
