name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.89.0"]
        exclude:
          # MSRV qualification is Linux-only; stable covers all three platforms.
          - os: macos-latest
            toolchain: "1.89.0"
          - os: windows-latest
            toolchain: "1.89.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # `--no-fail-fast` keeps every target reporting so one failing suite
      # (e.g. a platform-specific isolation reproducer) never hides the rest.
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  python-bindings:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            toolchain: '1.89.0'
          - os: ubuntu-latest
            python: '3.14'
            toolchain: stable
          - os: macos-latest
            python: '3.11'
            toolchain: stable
          - os: windows-latest
            python: '3.11'
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv run --directory crates/eggreplay-python --with maturin==1.14.1 --with pytest==8.4.2 --with pytest-asyncio==1.2.0 --with pytest-xdist==3.8.0 maturin develop
      - run: uv run --directory crates/eggreplay-python --with maturin==1.14.1 --with pytest==8.4.2 --with pytest-asyncio==1.2.0 --with pytest-xdist==3.8.0 python -m pytest tests -q
      - name: Ensure semantic crates remain Python-free
        shell: bash
        run: |
          for package in eggreplay-core eggreplay-store eggreplay-http; do
            if cargo tree -p "$package" --edges normal --prefix none | grep -E '^(pyo3|pyo3-async-runtimes) '; then
              echo "$package depends on Python" >&2
              exit 1
            fi
          done
          if cargo tree --workspace --invert eggreplay-python --edges normal --prefix none | grep -E '^eggreplay-(core|store|http|cli) '; then
            echo 'Rust product crates must not depend on the Python extension' >&2
            exit 1
          fi
      - run: uv run --directory crates/eggreplay-python --with maturin==1.14.1 maturin build --locked
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --directory crates/eggreplay-python --with maturin==1.14.1 maturin build --locked --out $GITHUB_WORKSPACE/target/python-artifacts
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --directory crates/eggreplay-python --with maturin==1.14.1 maturin sdist --out $GITHUB_WORKSPACE/target/python-artifacts
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        name: Check wheel and source archive contents
        run: |
          python - <<'PY'
          import glob
          import pathlib
          import tarfile
          import zipfile

          root = pathlib.Path("target/python-artifacts")
          archives = [*root.glob("*.whl"), *root.glob("*.tar.gz")]
          assert len(archives) == 2, archives
          forbidden = {".venv", ".pytest_cache", "__pycache__", "fixtures", "target"}
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as bundle:
                      members = bundle.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as bundle:
                      members = bundle.getnames()
              bad = [name for name in members if forbidden.intersection(pathlib.PurePosixPath(name).parts) or name.endswith((".pyc", ".pyo"))]
              assert not bad, f"unexpected files in {archive}: {bad}"
          PY

  python-abi3-cross-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - name: Build abi3 wheel under CPython 3.11
        run: uv run --directory crates/eggreplay-python --python 3.11 --with maturin==1.14.1 maturin build --locked --out $GITHUB_WORKSPACE/target/python-wheels
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the same wheel under CPython 3.14
        run: python -m pip install $GITHUB_WORKSPACE/target/python-wheels/*.whl pytest==8.4.2 pytest-asyncio==1.2.0 pytest-xdist==3.8.0
      - name: Smoke the installed wheel under CPython 3.14
        run: python -m pytest $GITHUB_WORKSPACE/crates/eggreplay-python/tests -q

  dependency-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      # Core/store must not pull transport runtimes.
      - run: cargo tree -p eggreplay-core --no-default-features --edges normal --prefix none | grep -Ei "(^|[[:space:]])(eggfetch|eggserve|eggress|tokio|hyper|tungstenite|base64)([[:space:]]|$)" && exit 1 || echo "core clean"
      - run: cargo tree -p eggreplay-store --no-default-features --edges normal --prefix none | grep -Ei "(^|[[:space:]])(eggfetch|eggserve|eggress|tokio|hyper|tungstenite|base64)([[:space:]]|$)" && exit 1 || echo "store clean"
      # Direct HTTP build must not require Eggress routing.
      - run: cargo check -p eggreplay-http --no-default-features --features direct
      # The codec is opt-in and belongs only to the HTTP adapter crate.
      - run: cargo check -p eggreplay-http --no-default-features --features websocket
      - run: cargo tree -p eggreplay-http --no-default-features --features direct --edges normal --prefix none | grep -Ei "(^|[[:space:]])(tungstenite|base64)([[:space:]]|$)" && exit 1 || echo "direct build has no WebSocket codec"
      # CLI Eggress grammar enables only the narrow pproxy-compat set.
      - run: cargo tree -p eggreplay-http --features eggress --edges normal --prefix none | grep -i "eggress-outbound" | head -n 5
      - run: cargo tree -p eggreplay-http --features eggress -i eggress-outbound --prefix none | grep -Ei "ssh|quic|extended" && exit 1 || echo "eggress narrow ok"
      # M013 interception is a leaf capability; no ordinary product graph may
      # acquire the CA generator or depend on the optional intercept crate.
      - run: |
          for package in eggreplay-core eggreplay-store eggreplay-http eggreplay-cli eggreplay-python; do
            if cargo tree -p "$package" --edges normal --prefix none | grep -E '^(eggreplay-intercept|rcgen) '; then
              echo "$package unexpectedly depends on optional interception/CA generation" >&2
              exit 1
            fi
          done
      - run: cargo check -p eggreplay-intercept --all-targets --locked

  interception:
    # M013F qualification lane: deterministic local CA/CONNECT/MITM coverage
    # that the ordinary all-features matrix also runs, pinned here so the
    # interception evidence stays attributable to one job. Runs wherever the
    # `verify` matrix runs (Ubuntu/macOS/Windows) plus the minimum-feature
    # graphs that prove the capability stays optional.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Minimum-feature graphs: default builds stay interception-free (tree
      # queries need metadata only, so the Python wheel lane needs no
      # interpreter here; the python-bindings jobs still own the wheel).
      # `shell: bash` keeps pipe/`&&`/`||` chains portable (Windows runners
      # default to pwsh, where `grep` chaining fails the step spuriously).
      - run: cargo check -p eggreplay-cli --no-default-features --locked
        shell: bash
      - run: cargo check -p eggreplay-intercept --all-targets --locked
        shell: bash
      - run: cargo tree -p eggreplay-python --edges normal --prefix none | grep -E '^(eggreplay-intercept|rcgen) ' && exit 1 || echo "python wheel lane interception-free"
        shell: bash
      # Full interception qualification: CA lifecycle, CONNECT policy,
      # MITM recording, hardening/secret audit, resource bounds, curl interop
      # (curl-gated tests skip where curl is absent, never fail).
      # `--no-fail-fast` keeps every suite reporting so isolation reproducers
      # always emit their signal even when a sibling suite fails.
      - run: cargo test -p eggreplay-intercept --all-features --locked --no-fail-fast
        shell: bash
      - run: cargo test -p eggreplay-cli --features intercept --locked
        shell: bash
