[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "eggreplay"
version = "0.1.0"
description = "Python bindings for EggReplay"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-MIT"]
readme = "README.md"
authors = [{ name = "Eggstack contributors" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/eggstack/eggreplay"
Issues = "https://github.com/eggstack/eggreplay/issues"

[project.entry-points.pytest11]
eggreplay = "eggreplay.pytest_plugin"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.maturin]
python-source = "python"
module-name = "eggreplay._native"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.venv/**"]
