[package]
name = "eggreplay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for EggReplay"

[[bin]]
name = "eggreplay"
path = "src/main.rs"

[dependencies]
clap.workspace = true
eggfetch-core.workspace = true
eggreplay-core = { path = "../eggreplay-core" }
eggreplay-http = { path = "../eggreplay-http", features = ["eggserve", "eggress", "websocket"] }
eggreplay-store = { path = "../eggreplay-store" }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
