[package]
name = "eggreplay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for EggReplay"

[[bin]]
name = "eggreplay"
path = "src/main.rs"

[dependencies]
clap.workspace = true
eggfetch-core.workspace = true
eggreplay-core = { path = "../eggreplay-core" }
eggreplay-har = { path = "../eggreplay-har" }
eggreplay-http = { path = "../eggreplay-http", features = ["eggserve", "eggress", "websocket"] }
eggreplay-intercept = { path = "../eggreplay-intercept", optional = true }
eggreplay-store = { path = "../eggreplay-store" }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

# Release-binary policy for the interception feature is decided at M013F.
# For now `intercept` is opt-in: default builds (library, Python wheel, source)
# stay CA-dependency-free, and all-features CI may enable it.
#
# The inbound HTTP/2 features (M015B, ADR 0010) follow the same discipline for
# the same reason: they admit EggServe Core and its `eggserve-static` closure.
# `h2-inbound` gives the CLI the cleartext/H2 serving policy; `h2-inbound-tls`
# adds ALPN-over-TLS with operator-supplied identity material. Neither is ever
# a default, and the `protocol-boundary` CI lane asserts that the default CLI
# graph is free of the multiprotocol closure.
[features]
default = []
intercept = ["dep:eggreplay-intercept"]
h2-inbound = ["eggreplay-http/h2-inbound"]
h2-inbound-tls = ["h2-inbound", "eggreplay-http/h2-inbound-tls"]

[lints]
workspace = true
